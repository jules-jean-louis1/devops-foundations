services:
  backend:
    build:
      target: development
    environment:
      - NODE_ENV=developpement
    ports:
      - "${DEV_BACKEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
