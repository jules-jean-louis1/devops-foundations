services:
  traefik:
    image: traefik:v3.6
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ../traefik/dynamic/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ../traefik/certs:/etc/traefik/certs:ro
      - ../traefik/.htpasswd:/etc/traefik/.htpasswd:ro
    networks:
      - traefik_net

  backend:
    build:
      context: ../src/backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://backend:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - backend_net
      - traefik_net

  frontend:
    build:
      context: ../src/frontend
      dockerfile: Dockerfile
    environment:
      - PUBLIC_BACKEND_URL=https://api.localhost
    depends_on:
      - backend
    networks:
      - traefik_net

  postgres:
    image: postgres:17.2-alpine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    networks:
      - backend_net

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 5s
      timeout: 30s
      retries: 3
    networks:
      - backend_net

  mailhog:
    image: mailhog/mailhog
    logging:
      driver: "none"
    ports:
      - "${PORT_SMTP:-1025}:1025"
      - "${MAIL_WEB_PORT:-8025}:8025"
    networks:
      - backend_net

  adminer:
    image: adminer:latest
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend_net
      - traefik_net

networks:
  backend_net:
    driver: bridge
  traefik_net:
    driver: bridge
