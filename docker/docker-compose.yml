services:
  traefik:
    image: traefik:v3.6
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../traefik/traefik.yml:/etc/traefik/traefik.yml:ro
    networks:
      - traefik_net

  backend:
    build:
      context: ../src/backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - backend_net
      - traefik_net
    labels:
      - traefik.enable=true
      - traefix.http.backend.rule=Host(`api.localhost`)

  frontend:
    build:
      context: ../src/frontend
      dockerfile: Dockerfile
    environment:
      - PUBLIC_BACKEND_URL=${BACKEND_URL}
    depends_on:
      - backend
    networks:
      - traefik_net
    labels:
      - traefik.enable=true
      - traefix.http.backend.rule=Host(`app.localhost`)

  postgres:
    image: postgres:17.2-alpine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    networks:
      - backend_net

  redis:
    image: redis:7-alpine
    networks:
      - backend_net

  mailhog:
    image: mailhog/mailhog
    logging:
      driver: "none"
    ports:
      - "${PORT_SMTP:-1025}:1025"
      - "${MAIL_WEB_PORT:-8025}:8025"
    networks:
      - backend_net

networks:
  backend_net:
    driver: bridge
  traefik_net:
    driver: bridge
