tls:
  certificates:
    - certFile: /etc/traefik/certs/local.crt
      keyFile: /etc/traefik/certs/local.key

http:
  middlewares:
    security-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        frameDeny: true
        contentTypeNosniff: true
        browserXssFilter: true

    compression:
      compress: {}

    api-ratelimit:
      rateLimit:
        average: 100
        burst: 50

    dashboard-auth:
      basicAuth:
        userFile: /etc/traefik/.htpasswd

  routers:
    traefik:
      rule: "Host(`traefik.localhost`)"
      entryPoints:
        - websecure
      service: api@internal
      tls: {}
      middlewares:
        - dashboard-auth
        - security-headers

    backend:
      rule: "Host(`api.localhost`)"
      entryPoints:
        - websecure
      service: backend
      tls: {}
      middlewares:
        - security-headers
        - compression
        - api-ratelimit

    frontend:
      rule: "Host(`app.localhost`)"
      entryPoints:
        - websecure
      service: frontend
      tls: {}
      middlewares:
        - security-headers
        - compression

    mailhog:
      rule: "Host(`mail.localhost`)"
      entryPoints:
        - websecure
      service: mailhog
      tls: {}
      middlewares:
        - security-headers
        - compression

    adminer:
      rule: "Host(`db.localhost`)"
      entryPoints:
        - websecure
      service: adminer
      tls: {}
      middlewares:
        - dashboard-auth
        - security-headers

  services:
    backend:
      loadBalancer:
        servers:
          - url: "http://backend:3000"

    frontend:
      loadBalancer:
        servers:
          - url: "http://frontend:3001"

    mailhog:
      loadBalancer:
        servers:
          - url: "http://mailhog:8025"

    adminer:
      loadBalancer:
        servers:
          - url: "http://adminer:8080"
